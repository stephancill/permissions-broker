name = "permissions-broker"
main = "src/worker.ts"
compatibility_date = "2026-07-18"
compatibility_flags = ["nodejs_compat"]
# Disable the public *.workers.dev subdomain; serve only on the custom route.
workers_dev = false
# vault.stupidtech.net is APP_BASE_URL (and the passkey RP ID). The previous
# domain, permissions-broker.stupidtech.net, was retired after the migration in
# docs/DOMAIN_MIGRATION.md.
routes = [
  { pattern = "vault.stupidtech.net", custom_domain = true }
]

# PWA icons; matched paths are served before the Worker runs.
[assets]
directory = "./public"

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "permissions-broker"
database_id = "02972638-483a-47c7-877a-1807ef493bc4"
migrations_dir = "migrations"
