name = "permissions-broker"
main = "src/worker.ts"
compatibility_date = "2026-07-18"
compatibility_flags = ["nodejs_compat"]
# Disable the public *.workers.dev subdomain; serve only on the custom route.
workers_dev = false
# vault.stupidtech.net is APP_BASE_URL. permissions-broker.stupidtech.net is
# the previous domain (WEBAUTHN_LEGACY_RP_ID): it serves /.well-known/webauthn
# for old passkeys and the /v1 API, and redirects pages.
routes = [
  { pattern = "vault.stupidtech.net", custom_domain = true },
  { pattern = "permissions-broker.stupidtech.net/*", zone_name = "stupidtech.net" }
]

# PWA icons; matched paths are served before the Worker runs.
[assets]
directory = "./public"

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "permissions-broker"
database_id = "02972638-483a-47c7-877a-1807ef493bc4"
migrations_dir = "migrations"
